name: CI — Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: {}   # manual trigger from any branch (e.g. to verify
                          # a feature branch's CI before opening a PR --
                          # push/pull_request above only fire for
                          # master/main, so a direct push to another branch
                          # never runs this workflow on its own)

# Least privilege: read-only token; no job here writes to the repository.
permissions:
  contents: read

jobs:
  changelog:
    name: Changelog format (Keep a Changelog + SemVer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint CHANGELOG.md and test the tool
        run: |
          python3 tools/changelog.py check --require-unreleased
          python3 -I tools/test_changelog.py
      - name: Every TODO has an ID listed in docs/ai/todo-register.md
        run: |
          python3 -I tools/test_check_todos.py
          python3 -I tools/check_todos.py
      - name: Markdown code fences name a language
        run: |
          python3 -I tools/test_check_md_fences.py
          python3 -I tools/check_md_fences.py
      - name: Suppressions (NOLINT, noqa, pragma diagnostic) must not increase
        run: |
          python3 -I tools/test_check_suppressions.py
          python3 -I tools/check_suppressions.py
      - name: Mutable statics in src/ must not increase
        run: |
          python3 -I tools/test_check_mutable_statics.py
          python3 -I tools/check_mutable_statics.py
      - name: No machine paths or identifiers in the project-memory docs
        run: |
          python3 -I tools/test_check_path_leaks.py
          python3 -I tools/check_path_leaks.py
      - name: Source files must not grow past 500 lines (baseline for the existing ones)
        run: |
          python3 -I tools/test_check_file_sizes.py
          python3 -I tools/check_file_sizes.py
      - name: Coverage floor check (unit tests)
        run: python3 -I tools/test_check_coverage.py
      - name: Header include guards (TN_..._H, no #pragma once)
        run: |
          python3 -I tools/test_check_header_guards.py
          python3 -I tools/check_header_guards.py
      - name: Every header compiles on its own
        run: |
          sh tools/test_check_headers_standalone.sh
          sh tools/check_headers_standalone.sh gcc
      - name: Module include cycles (no new coupling inside a cycle)
        run: |
          python3 -I tools/check_include_layers.py --self-test
          python3 -I tools/check_include_layers.py
      - name: No stray files at the repository root
        run: |
          sh tools/test_check_root_files.sh
          sh tools/check_root_files.sh
      - name: Multimodal extractor adapter tests (needs numpy)
        run: |
          pip install --quiet numpy
          python3 -I tools/test_extract_multimodal.py
      - name: SBOM generator tests
        run: python3 -I tools/test_gen_sbom.py
      - name: Benchmark scripts (tools/bench) unit tests
        run: python3 tools/bench/test_bench.py
      - name: Python lint (ruff, syntax errors and unused or undefined names)
        run: |
          pip install --quiet ruff==0.16.9
          ruff check .
          ruff format --check .
      # 2026-11-11: .agents/rules and .github/instructions are generated from .claude/rules.
      - name: AI adapter files in sync with .claude/rules
        run: python3 -I tools/sync_ai_adapters.py --check

  pr-size:
    name: Pull request size (max 400 changed lines)
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'size-override')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Count changed lines against the base branch
        run: |
          python3 -I tools/test_check_pr_size.py
          python3 -I tools/check_pr_size.py "origin/${{ github.base_ref }}"

  format:
    name: C/C++ formatting (clang-format 18)
    runs-on: ubuntu-24.04            # pinned image: its clang-format-18 is the one the tree was formatted with
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install clang-format 18
        run: sudo apt-get install -y -q clang-format-18
      - name: Check formatting (make check-format)
        run: make check-format CLANG_FORMAT=clang-format-18

  static-analysis:
    name: clang-tidy ratchet (bugprone, cert, clang-analyzer)
    runs-on: ubuntu-24.04            # pinned image: clang-tidy-18 gives the same count as the committed baseline
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install clang-tidy 18
        run: sudo apt-get install -y -q clang-tidy-18
      - name: No new findings (tools/clang_tidy_baseline.txt)
        run: sh tools/check_clang_tidy.sh

  webui:
    name: Web UI (svelte-check, build, committed bundle up to date)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies from the lockfile
        run: cd webui && npm ci --no-audit --no-fund
      - name: Unit tests (node --test, markdown renderer and XSS cases)
        run: cd webui && npm test
      - name: svelte-check (0 errors, 0 warnings)
        run: cd webui && npm run check
      - name: Build the bundle and require the committed C file to match it
        run: |
          cd webui && npm run build && cd ..
          make webui-bundle CC=gcc
          git diff --exit-code -- src/api/webui_bundle_generated.c || {
            echo "src/api/webui_bundle_generated.c is stale: run 'make webui-bundle' and commit it"; exit 1; }

  npm-audit:
    name: npm audit (web UI and screenshot tooling)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Production dependencies must have no known vulnerabilities (blocking)
        run: |
          for d in webui tools/screenshots/cli; do
            echo "== $d"; (cd "$d" && npm audit --omit=dev --audit-level=low)
          done
      - name: Build-time (dev) dependencies, for information
        continue-on-error: true      # vite 5 / svelte 4 advisories need a major upgrade
        run: |
          for d in webui tools/screenshots/cli; do
            echo "== $d"; (cd "$d" && npm audit --audit-level=high)
          done

  installer:
    name: Installer (install.sh, offline mirror)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint (shellcheck)
        run: shellcheck install.sh tools/test_install.sh tools/check_dist_isa.sh
      - name: Lint every first-party shell script (warnings and errors)
        # benchmark_results/ holds archived evidence scripts and is not linted.
        run: git ls-files '*.sh' | grep -v '^benchmark_results/' | xargs shellcheck -S warning
      - name: Build (release)
        run: make release CC=gcc
      - name: Install / upgrade / refuse tampered / uninstall (dash + bash)
        run: sh tools/test_install.sh ./pz

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: |
          sudo apt-get update -q || { echo "apt-get update failed; dropping the runner's third-party Microsoft repo (unused) and retrying"; sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/*microsoft*; sudo apt-get update -q; }
          sudo apt-get install -y -q gcc clang make

      - name: Build (release)
        run: make release CC=${{ matrix.compiler }} WERROR=1   # warnings are errors in CI only

      - name: Run tests
        run: make test CC=${{ matrix.compiler }} WERROR=1

      - name: Build (debug + sanitizers)
        run: make debug CC=${{ matrix.compiler }} WERROR=1

      - name: Build (portable dist) + smoke test
        run: |
          make clean
          make dist CC=${{ matrix.compiler }}
          file pz
          # Portable build must not dynamically link libstdc++/libgcc.
          if ldd pz | grep -Eq 'libstdc\+\+|libgcc_s'; then
            echo "ERROR: dist binary dynamically links libstdc++/libgcc"; exit 1
          fi
          ./pz --version
          # Phase 39 transition alias (one release): must still run.
          ./adaptive_ai_engine --version
          # The portable binary must really contain the AVX-512/VBMI tiers (a tier hidden behind a
          # compile-time guard in a baseline file silently vanishes from it; docs/ai/mistakes.md,
          # 2026-11-18) and no baseline file may carry such guards beyond the shrinking PENDING list.
          sh tools/check_dist_isa.sh ./pz
          python3 tools/check_isa_guards.py
          # Quantisation must round to nearest, never truncate (docs/ai/mistakes.md, 2026-11-18).
          python3 tools/check_rounding.py --self-test
          python3 tools/check_rounding.py

  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build (release)
        run: make release

      - name: Run tests
        run: make test

  cmake-build-check:
    name: CMake build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure
        run: cmake -B build_cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_cmake -j$(nproc) --target pz

  golden-output-regression:
    name: Golden-output regression (TS-5.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: |
          sudo apt-get update -q || { echo "apt-get update failed; dropping the runner's third-party Microsoft repo (unused) and retrying"; sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/*microsoft*; sudo apt-get update -q; }
          sudo apt-get install -y -q gcc make python3

      - name: Build (release)
        run: make release CC=gcc

      # Cached by filename -- SmolLM2-135M-Instruct-Q8_0.gguf is an
      # immutable release artifact on Hugging Face, never rewritten in place.
      - name: Cache test model
        id: model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: models/smollm2-q8_0.gguf
          key: smollm2-135m-instruct-q8_0-gguf

      - name: Download test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL --retry 3 -o models/smollm2-q8_0.gguf \
            "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q8_0.gguf"

      - name: Run golden-output regression (determinism matrix + JSON mode)
        run: tests/golden_regression.sh models/smollm2-q8_0.gguf

      - name: Run E2E JSON-mode test (CLI + API, TS-2.3/2.4)
        run: tests/e2e_json_mode.sh models/smollm2-q8_0.gguf

      - name: Run E2E API concurrency test (429 while busy, none for sequential clients)
        run: tests/e2e_api_concurrency.sh models/smollm2-q8_0.gguf

      - name: Prompt injection (message text never becomes chat markup)
        run: |
          make build/tests/test_prompt_injection CC=gcc
          PZ_TEST_MODEL=models/smollm2-q8_0.gguf build/tests/test_prompt_injection

  coverage:
    name: Coverage (TS-5.5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: |
          sudo apt-get update -q || { echo "apt-get update failed; dropping the runner's third-party Microsoft repo (unused) and retrying"; sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/*microsoft*; sudo apt-get update -q; }
          sudo apt-get install -y -q gcc make lcov

      - name: Generate coverage report
        run: make coverage CC=gcc

      - name: Enforce the coverage floor
        run: python3 tools/check_coverage.py

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: build/coverage/html
          retention-days: 30
