name: Secret scan

# Gitleaks over the full git history on every push and pull request, and weekly. A finding fails
# the run. Known false positives go in .gitleaksignore (one fingerprint per line, with a comment
# saying why) -- never a blanket allow-list.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "41 3 * * 1"      # weekly, Monday 03:41 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
